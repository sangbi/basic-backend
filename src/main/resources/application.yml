spring:
  application:
    name: backend

  profiles:
    active: local

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.basic.backend.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: debug
    com.basic.backend: debug

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - http://localhost:3002
      - http://localhost:3003
      - https://whisking-craftsman-repressed.ngrok-free.dev
  file:
    upload-dir: D:\basic\upload