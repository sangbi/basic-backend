jwt:
  secret: ${JWT_SECRET}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

logging:
  level:
    root: info
    com.basic.backend: info

app:
  cors:
    allowed-origins:
      - https://dev.example.com

swagger:
  enabled: true